# Local ports are remapped so this stack can run alongside other Supabase
# projects on the same machine (toolbox=544xx, saas=554xx, sensor=564xx).
# Default 54322 is already taken (another local Supabase).
project_id = "dx-sensor"

[api]
enabled = true
port = 56421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56422
shadow_port = 56420
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 56429

[studio]
enabled = true
port = 56423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 56424

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8085

[analytics]
enabled = true
port = 56427
backend = "postgres"
